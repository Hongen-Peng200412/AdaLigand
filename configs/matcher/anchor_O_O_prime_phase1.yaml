# Anchor O/O′ Matcher Phase1 正式配置；参数身份为 v1/seed_3407。
# matcher.train 读取本文件；resume_checkpoint=null 表示建立全新 Phase1 run。
run:
  phase: 1
  seed: 3407
  device: cuda
  bf16: true
  max_epochs: 20
  val_per_epoch: 5
  output_dir: /storage/penghongen/AdaLigand/Results/matcher/anchor_O_O_prime_v1/seed_3407_occ48/phase1
  resume_checkpoint: null

data:
  data_root: /storage/penghongen/AdaLigand/Ori_Data
  stage1_preparation_root: /storage/penghongen/AdaLigand/Ori_Data/stage1_preparation
  experiment_manifest: /storage/penghongen/AdaLigand/Ori_Data/matcher/anchor_O_O_prime_v1/manifest.json
  # 按列表顺序拼接 A 原子特征；当前 Anchor 路线只实现 feat_l0。
  A_node_feature_sources: [feat_l0]
  num_workers: 4
  occurrence_budget_per_batch: 48
  p_miss: 0.30
  p_split: 0.20
  p_hit: 0.50
  max_context_ratio: 2.0
  empty_A_context_skip_probability: 0.80
  receptor_radius: 18.0
  graph_radius: 4.0
  graph_max_radius_neighbors: 48
  graph_rbf_bins: 16

model:
  A_node_input_dim: 49
  edge_input_dim: 31
  node_dim: 128
  edge_dim: 64
  repr_dim: 256
  num_heads: 8
  coarse_layers_per_block: 2
  coarse_ffn_dim: 512
  phase1_blocks: 4
  phase2_blocks: 4
  dropout: 0.1
  mode: coupled_plus_modal
  # 四个整数依次是 U-Net 四级通道；重新训练只调整执行期显存参数，不改变模型宽度。
  map_channels: [24, 48, 72, 96]
  # map_candidate_chunk_size 的单位是候选数；null 表示一次处理当前 batch 的全部候选。
  map_candidate_chunk_size: 32
  map_input_channels: 1
  map_input_shape_zyx: [48, 48, 48]
  map_norm_groups: 8
  map_bottleneck_heads: 4
  map_bottleneck_layers: 1
  map_bottleneck_ffn_dim: 128
  map_activation_checkpoint: true  # 反向时重算 U-Net 中间激活，降低图网络反向阶段仍被占用的显存。
  map_scale_summary_dim: 64
  map_summary_hidden_dim: 512
  candidate_bias_rbf_bins: 32
  candidate_bias_hidden_dim: 64
  candidate_bias_distance_scale: 12.0
  O_initial_prior: 0.01
  O_prime_initial_value: 0.2
  graph_update_edge: true
  graph_activation_checkpoint: true  # 反向时重算每个 MatcherBlock 内配体与 A 的 GatedGCN 实体更新。
  # false 是正式默认值：Phase2 新 stem 不读取冻结 Block 4 的 FiLM_plus 条件。
  phase2_use_FiLM_plus: false
  phase2_condition_mlp_ratio: 2.0
  phase2_condition_dropout: 0.0
  # fine_pair_chunk_size 是一次联合 FinePair forward 中的候选框—occurrence 配对数上限；null 表示当前 PDB 一次计算完整 C×S 配对网格。
  fine_pair_chunk_size: 1024
  fine_pair_activation_checkpoint: true
  fine_attention_use_ffn: false  # 显式关闭细注意力后的额外 FFN。
  fine_attention_ffn_hidden_dim: 512
  fine_readout_dim: 512

objective:
  O_radius: 12.0
  O_prime_scale: 6.0
  O_prime_observed_radius: 24.0
  O_prime_truncation_value: 0.2
  coarse_deep_total_weight: 0.5
  coarse_deep_schedule: linear_depth
  lambda_O: 1.0
  lambda_O_prime: 1.0
  entity_aux_weight: 0.1
  # 权重为 0 时不构造 FinePairAuxiliaryHead，也不读取细配对标签。
  fine_pair_aux_weight: 0.0

optimizer:
  name: AdamW
  lr: 5.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip_norm: 0.5

scheduler:
  name: warmup_plateau
  warmup_ratio: 0.005
  warmup_steps: null  # null 表示按 warmup_ratio 和预计总优化步数计算。
  warmup_start_factor: 0.33
  factor: 0.3
  patience: 2
  monitor: val/F1_O_O_prime
  mode: max
  threshold: 0.003
  threshold_mode: abs
  cooldown: 0
  min_lr: 0.0
  eps: 1.0e-8
  stop_after_lr_reductions: 3  # 实际发生第三次 plateau 降学习率后结束本阶段。

evaluation:
  decoder_name: O_O_prime
  fallback_O_threshold: 0.5  # 尚无最佳验证阈值时才使用。
  threshold_step: 0.01  # 完整验证集 O 概率阈值扫描步长。

wandb:
  enabled: true
  mode: online  # 正式任务直接同步到 W&B；初始化失败时终止，不静默切换为 offline。
  project: AdaLigand_Matcher
  group: anchor_O_O_prime_v1_seed_3407_occ48
  name: anchor_O_O_prime_v1_seed_3407_occ48_phase1
  log_every_n_steps: 10
