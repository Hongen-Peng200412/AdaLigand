[project]
name = "adaligand-stage1"
version = "0.1.0"
description = "AdaLigand Stage A-C data enumeration, download, and mmCIF parsing."
requires-python = ">=3.10"
dependencies = [
    "gemmi>=0.7.1",
    "joblib>=1.4.2",
    "numpy>=1.26",
    "pdbeccdutils>=0.8.5",
    "rdkit>=2024.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

